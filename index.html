<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-runr Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0F1A;
    --panel: #141A2A;
    --ink: #F4F6FB;
    --muted: #9AA3B8;
    --lime: #C6FF3D;
    --violet: #7C5CFF;
    --pink: #FF4D8D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #05070D;
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---------- 1080x1920 stage, scaled to fit ---------- */
  #stage {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: var(--bg);
    transform-origin: center center;
  }
  .abs { position: absolute; }
  .center-x { left: 0; right: 0; text-align: center; }
  .blob { position: absolute; border-radius: 50%; filter: blur(140px); opacity: .55; will-change: transform; }

  /* Scene 1: logo */
  #s1 { inset: 0; }
  #logo { top: 760px; font-size: 168px; font-weight: 700; letter-spacing: -6px; white-space: nowrap; }
  #logo span { display: inline-block; }
  #logo .accent { color: var(--lime); }
  #track { left: 0; top: 960px; width: 1080px; height: 260px; overflow: visible; }

  /* Scene 2: tagline */
  #s2 { left: 80px; right: 40px; top: 760px; }
  .line { overflow: hidden; font-size: 128px; font-weight: 700; line-height: 1.05; letter-spacing: -5px; }
  .line > span { display: inline-block; }
  .line.hl > span { color: var(--lime); }

  /* Scene 3: phone + features */
  #s3 { inset: 0; }
  #s3-head { top: 150px; font-size: 92px; font-weight: 700; letter-spacing: -3px; line-height: 1.05; }
  #s3-head em { font-style: normal; color: var(--lime); }
  #phone {
    left: 240px; top: 470px; width: 600px; height: 1220px;
    border-radius: 84px;
    background: #0E1322;
    border: 14px solid #232B40;
    box-shadow: 0 60px 120px rgba(0,0,0,.55), 0 0 0 2px #39425C inset;
    overflow: hidden;
  }
  #notch { left: 50%; top: 18px; width: 180px; height: 40px; margin-left: -90px; border-radius: 30px; background: #000; }
  #map {
    left: 26px; right: 26px; top: 86px; height: 640px; border-radius: 48px; overflow: hidden;
    background:
      linear-gradient(rgba(255,255,255,.05) 2px, transparent 2px) 0 0 / 64px 64px,
      linear-gradient(90deg, rgba(255,255,255,.05) 2px, transparent 2px) 0 0 / 64px 64px,
      linear-gradient(160deg, #18213A, #101627);
  }
  #map svg { width: 100%; height: 100%; }
  #stats { left: 26px; right: 26px; top: 752px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .stat { background: var(--panel); border-radius: 36px; padding: 24px 24px; }
  .stat.wide { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; }
  .stat .k { font-size: 26px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .stat .v { font-size: 54px; font-weight: 700; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 26px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 6px; }
  #live { font-size: 28px; font-weight: 700; color: #0B0F1A; background: var(--lime); border-radius: 30px; padding: 12px 26px; }
  .chip {
    display: flex; align-items: center; gap: 22px;
    padding: 26px 40px 26px 26px;
    border-radius: 999px;
    background: rgba(20,26,42,.86);
    border: 2px solid rgba(255,255,255,.08);
    backdrop-filter: blur(12px);
    font-size: 40px; font-weight: 500; white-space: nowrap;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
  }
  .chip i { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 34px; color: #0B0F1A; }

  /* Scene 4: CTA */
  #s4 { inset: 0; }
  #mark {
    left: 50%; top: 520px; width: 240px; height: 240px; margin-left: -120px;
    border-radius: 68px; background: var(--lime);
    display: grid; place-items: center;
    box-shadow: 0 40px 100px rgba(198,255,61,.35);
  }
  #cta-title { top: 830px; font-size: 140px; font-weight: 700; letter-spacing: -5px; }
  #cta-title .accent { color: var(--lime); }
  #cta-sub { top: 1010px; font-size: 50px; color: var(--muted); }
  #btn-wrap { left: 0; right: 0; top: 1180px; height: 150px; }
  #btn, #pulse {
    position: absolute; left: 50%; top: 0; width: 560px; height: 150px; margin-left: -280px;
    border-radius: 999px;
  }
  #btn { background: var(--lime); color: #0B0F1A; font-size: 58px; font-weight: 700; display: grid; place-items: center; }
  #pulse { border: 6px solid var(--lime); }
  #stores { top: 1400px; font-size: 38px; color: var(--muted); letter-spacing: 2px; }

  #fade { inset: 0; background: #000; pointer-events: none; }

  /* ---------- Controls (hidden in clean mode) ---------- */
  #controls {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(520px, calc(100% - 32px));
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 14px;
    background: rgba(20,26,42,.92); border: 1px solid rgba(255,255,255,.1);
    font-size: 13px; color: var(--muted);
  }
  #controls button {
    font: inherit; color: var(--ink); background: #232B40; border: 0; border-radius: 8px;
    padding: 7px 10px; cursor: pointer; white-space: nowrap;
  }
  #controls button:hover { background: #2F3954; }
  #controls input[type=range] { flex: 1; min-width: 60px; accent-color: var(--lime); }
  #time { font-variant-numeric: tabular-nums; min-width: 38px; text-align: right; }
  body.clean #controls { display: none; }
</style>
</head>
<body>

<div id="stage">
  <div class="blob" id="b1" style="width:900px;height:900px;background:var(--violet)"></div>
  <div class="blob" id="b2" style="width:800px;height:800px;background:var(--pink)"></div>
  <div class="blob" id="b3" style="width:700px;height:700px;background:var(--lime);opacity:.22"></div>

  <!-- Scene 1: logo reveal -->
  <div id="s1" class="abs">
    <div id="logo" class="abs center-x"></div>
    <svg id="track" class="abs" viewBox="0 0 1080 260">
      <path id="track-path" d="M -40 200 C 180 200, 260 40, 470 60 S 760 200, 1120 30"
            fill="none" stroke="var(--lime)" stroke-width="16" stroke-linecap="round"/>
      <circle id="track-dot" r="22" fill="var(--lime)"/>
    </svg>
  </div>

  <!-- Scene 2: tagline -->
  <div id="s2" class="abs"></div>

  <!-- Scene 3: product -->
  <div id="s3" class="abs">
    <div id="s3-head" class="abs center-x"></div>
    <div id="phone" class="abs">
      <div id="notch" class="abs"></div>
      <div id="map" class="abs">
        <svg viewBox="0 0 548 640">
          <path id="route-ghost" d="M 80 560 C 60 440, 200 430, 210 340 S 90 200, 170 120 S 380 60, 420 170 S 330 330, 400 420 S 500 560, 450 590"
                fill="none" stroke="rgba(255,255,255,.12)" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 26"/>
          <path id="route" d="M 80 560 C 60 440, 200 430, 210 340 S 90 200, 170 120 S 380 60, 420 170 S 330 330, 400 420 S 500 560, 450 590"
                fill="none" stroke="var(--lime)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="80" cy="560" r="14" fill="#0B0F1A" stroke="var(--lime)" stroke-width="6"/>
          <circle id="runner-glow" r="40" fill="var(--lime)" opacity=".25"/>
          <circle id="runner" r="18" fill="var(--lime)" stroke="#0B0F1A" stroke-width="6"/>
        </svg>
      </div>
      <div id="stats" class="abs">
        <div class="stat"><div class="k">Distance</div><div class="v"><span id="dist">0.00</span><small>km</small></div></div>
        <div class="stat"><div class="k">Pace</div><div class="v"><span id="pace">–'––"</span><small>/km</small></div></div>
        <div class="stat wide"><div><div class="k">Time</div><div class="v" id="clock">00:00</div></div><div id="live">● LIVE</div></div>
      </div>
    </div>
    <div class="chip abs" id="chip0"><i style="background:var(--lime)">1</i><span></span></div>
    <div class="chip abs" id="chip1"><i style="background:var(--pink)">2</i><span></span></div>
    <div class="chip abs" id="chip2"><i style="background:var(--violet);color:#fff">3</i><span></span></div>
  </div>

  <!-- Scene 4: call to action -->
  <div id="s4" class="abs">
    <div id="mark" class="abs">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <path d="M 20 110 C 50 110, 60 40, 95 40 L 130 40" fill="none" stroke="#0B0F1A" stroke-width="20" stroke-linecap="round"/>
        <path d="M 108 18 L 132 40 L 108 62" fill="none" stroke="#0B0F1A" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div id="cta-title" class="abs center-x"></div>
    <div id="cta-sub" class="abs center-x"></div>
    <div id="btn-wrap" class="abs"><div id="pulse"></div><div id="btn"></div></div>
    <div id="stores" class="abs center-x"></div>
  </div>

  <div id="fade" class="abs"></div>
</div>

<div id="controls">
  <button id="play" type="button">Pause</button>
  <button id="restart" type="button">Restart</button>
  <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Timeline">
  <span id="time">0.0s</span>
  <button id="clean" type="button" title="Hide controls for screen recording (H)">Hide UI</button>
</div>

<script>
/* ============================================================
   Edit this block to change the promo's text.
   ============================================================ */
const CONFIG = {
  brand: ['First-', 'runr'],              // second part is highlighted
  tagline: ['Your first run', 'starts', 'right here.'], // last line highlighted
  productHeadline: 'Every step,<br><em>tracked.</em>',
  features: ['Live GPS tracking', 'Beat your best pace', 'Run with friends'],
  run: { km: 5.24, seconds: 27 * 60 + 15 },
  ctaSub: 'Run your first. Then your next.',
  ctaButton: 'Download free',
  stores: 'iOS  ·  ANDROID',
};

/* ---------------- timeline ---------------- */
const DURATION = 14; // seconds, loops

const $ = (id) => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const ease = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  in: (x) => x * x * x,
  back: (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
const style = (el, opacity, transform, filter) => {
  el.style.opacity = opacity;
  el.style.visibility = opacity <= 0.001 ? 'hidden' : 'visible';
  if (transform !== undefined) el.style.transform = transform;
  if (filter !== undefined) el.style.filter = filter;
};

/* ---------------- build DOM from CONFIG ---------------- */
const logoLetters = [];
CONFIG.brand.forEach((part, pi) => {
  [...part].forEach((ch) => {
    const s = document.createElement('span');
    s.textContent = ch;
    if (pi === 1) s.className = 'accent';
    $('logo').appendChild(s);
    logoLetters.push(s);
  });
});

const tagSpans = CONFIG.tagline.map((text, i) => {
  const line = document.createElement('div');
  line.className = 'line' + (i === CONFIG.tagline.length - 1 ? ' hl' : '');
  const span = document.createElement('span');
  span.textContent = text;
  line.appendChild(span);
  $('s2').appendChild(line);
  return span;
});

$('s3-head').innerHTML = CONFIG.productHeadline;
const chips = [0, 1, 2].map((i) => {
  const el = $('chip' + i);
  el.querySelector('span').textContent = CONFIG.features[i];
  return el;
});
// chip layout: alternate sides, overlapping the phone edge
const chipPos = [
  { side: 'left', top: 640 },
  { side: 'right', top: 960 },
  { side: 'left', top: 1590 },
];
chips.forEach((el, i) => {
  el.style.top = chipPos[i].top + 'px';
  if (chipPos[i].side === 'left') el.style.left = '60px';
  else el.style.right = '60px';
});

$('cta-title').innerHTML = `${CONFIG.brand[0]}<span class="accent">${CONFIG.brand[1]}</span>`;
$('cta-sub').textContent = CONFIG.ctaSub;
$('btn').textContent = CONFIG.ctaButton;
$('stores').textContent = CONFIG.stores;

const trackPath = $('track-path');
const trackLen = trackPath.getTotalLength();
trackPath.style.strokeDasharray = trackLen;
const route = $('route');
const routeLen = route.getTotalLength();
route.style.strokeDasharray = routeLen;

const fmtClock = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const paceSec = CONFIG.run.seconds / CONFIG.run.km;
const paceText = `${Math.floor(paceSec / 60)}'${String(Math.round(paceSec % 60)).padStart(2, '0')}"`;

/* ---------------- render a frame at time t ---------------- */
function render(t) {
  // background drift
  $('b1').style.transform = `translate(${-250 + Math.sin(t * 0.45) * 160}px, ${-200 + Math.cos(t * 0.35) * 220}px)`;
  $('b2').style.transform = `translate(${520 + Math.cos(t * 0.4) * 180}px, ${1250 + Math.sin(t * 0.5) * 200}px)`;
  $('b3').style.transform = `translate(${300 + Math.sin(t * 0.3 + 2) * 260}px, ${700 + Math.cos(t * 0.42) * 300}px)`;

  // ---- Scene 1: logo (0 – 3.2s)
  const s1Out = ease.inOut(prog(t, 2.6, 3.15));
  style($('s1'), 1 - s1Out, `scale(${1 + s1Out * 0.35})`, `blur(${s1Out * 16}px)`);
  logoLetters.forEach((el, i) => {
    const x = prog(t, 0.35 + i * 0.055, 0.95 + i * 0.055);
    el.style.opacity = ease.out(x);
    el.style.transform = `translateY(${(1 - ease.back(x)) * 160}px)`;
  });
  const draw = ease.inOut(prog(t, 0.1, 1.5));
  trackPath.style.strokeDashoffset = trackLen * (1 - draw);
  const tp = trackPath.getPointAtLength(trackLen * draw);
  $('track-dot').setAttribute('cx', tp.x);
  $('track-dot').setAttribute('cy', tp.y);
  $('track-dot').style.opacity = draw > 0 && draw < 1 ? 1 : 0;

  // ---- Scene 2: tagline (3.0 – 5.6s)
  style($('s2'), t > 2.9 && t < 5.7 ? 1 : 0);
  tagSpans.forEach((el, i) => {
    const inX = ease.out(prog(t, 3.0 + i * 0.18, 3.6 + i * 0.18));
    const outX = ease.in(prog(t, 5.05 + i * 0.08, 5.45 + i * 0.08));
    el.style.transform = `translateY(${(1 - inX) * 110 - outX * 110}%)`;
  });

  // ---- Scene 3: product (5.4 – 10.8s)
  const s3Out = ease.inOut(prog(t, 10.2, 10.75));
  style($('s3'), t > 5.3 && t < 10.8 ? 1 - s3Out : 0, `translateY(${-s3Out * 260}px)`);
  const phoneIn = ease.out(prog(t, 5.4, 6.3));
  $('phone').style.transform = `translateY(${(1 - phoneIn) * 1500}px) rotate(${(1 - phoneIn) * 8}deg)`;
  const headIn = ease.out(prog(t, 5.55, 6.2));
  style($('s3-head'), headIn, `translateY(${(1 - headIn) * 60}px)`);

  const rp = ease.inOut(prog(t, 6.2, 9.8));
  route.style.strokeDashoffset = routeLen * (1 - rp);
  const rpt = route.getPointAtLength(routeLen * rp);
  ['runner', 'runner-glow'].forEach((id) => {
    $(id).setAttribute('cx', rpt.x);
    $(id).setAttribute('cy', rpt.y);
  });
  $('runner-glow').setAttribute('r', 34 + Math.sin(t * 8) * 8);
  $('dist').textContent = (CONFIG.run.km * rp).toFixed(2);
  $('clock').textContent = fmtClock(CONFIG.run.seconds * rp);
  $('pace').textContent = rp > 0.02 ? paceText : `–'––"`;
  $('live').style.opacity = 0.55 + 0.45 * Math.abs(Math.sin(t * 3));

  chips.forEach((el, i) => {
    const x = prog(t, 6.6 + i * 0.9, 7.15 + i * 0.9);
    const dir = chipPos[i].side === 'left' ? -1 : 1;
    style(el, ease.out(x), `translateX(${(1 - ease.out(x)) * dir * 220}px) scale(${lerp(0.7, 1, ease.back(x))})`);
  });

  // ---- Scene 4: CTA (10.6 – 14s)
  style($('s4'), t > 10.5 ? 1 : 0);
  const markIn = prog(t, 10.6, 11.25);
  style($('mark'), ease.out(markIn), `scale(${ease.back(markIn)}) rotate(${(1 - ease.out(markIn)) * -90}deg)`);
  const titleIn = ease.out(prog(t, 10.95, 11.6));
  style($('cta-title'), titleIn, `translateY(${(1 - titleIn) * 80}px)`);
  const subIn = ease.out(prog(t, 11.2, 11.8));
  style($('cta-sub'), subIn, `translateY(${(1 - subIn) * 50}px)`);
  const btnIn = prog(t, 11.45, 12.05);
  style($('btn'), ease.out(btnIn), `scale(${lerp(0.6, 1, ease.back(btnIn))})`);
  const pulse = t > 12.05 ? ((t - 12.05) % 1) : 0;
  style($('pulse'), t > 12.05 ? (1 - pulse) * 0.8 : 0, `scale(${1 + pulse * 0.28}, ${1 + pulse * 0.6})`);
  const storesIn = ease.out(prog(t, 11.8, 12.4));
  style($('stores'), storesIn);

  // fade from/to black for a seamless loop
  $('fade').style.opacity = Math.max(1 - prog(t, 0, 0.35), ease.in(prog(t, DURATION - 0.45, DURATION)));
}

/* ---------------- playback ---------------- */
const scrub = $('scrub');
scrub.max = DURATION;
let playing = true;
let t = 0;
let last = performance.now();

function fit() {
  const reserve = document.body.classList.contains('clean') ? 0 : 76;
  const s = Math.min(innerWidth / 1080, (innerHeight - reserve) / 1920);
  $('stage').style.transform = `translate(-50%, calc(-50% - ${reserve / 2}px)) scale(${s})`;
}

function tick(now) {
  if (playing) t = (t + (now - last) / 1000) % DURATION;
  last = now;
  render(t);
  scrub.value = t;
  $('time').textContent = t.toFixed(1) + 's';
  requestAnimationFrame(tick);
}

function setPlaying(p) { playing = p; $('play').textContent = p ? 'Pause' : 'Play'; }
function toggleClean() { document.body.classList.toggle('clean'); fit(); }

$('play').onclick = () => setPlaying(!playing);
$('restart').onclick = () => { t = 0; setPlaying(true); };
scrub.oninput = () => { t = +scrub.value; setPlaying(false); };
$('clean').onclick = toggleClean;
addEventListener('keydown', (e) => {
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'h' || e.key === 'H') toggleClean();
  else if (e.key === 'r' || e.key === 'R') { t = 0; setPlaying(true); }
});
addEventListener('resize', fit);
if (new URLSearchParams(location.search).has('clean')) document.body.classList.add('clean');

// for scripted frame capture: seek(seconds) pauses and renders that frame
window.seek = (s) => { setPlaying(false); t = clamp(s, 0, DURATION); render(t); };

fit();
requestAnimationFrame(tick);
</script>
</body>
</html>
